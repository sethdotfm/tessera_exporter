# tessera_exporter CONFIGURATION FILE // Version 1.1.1
# https://github.com/sethdotfm/tessera_exporter
#
# Note: disabling a collector does NOT reduce load on the processor or the exporter. All endpoints are fetched, then filtered according to this config.

collectors:
  system: true      # processor temps, fans, identity (serial, name, type, version)
  input: true       # signal present, resolution, refresh rate, proc-amp
  output: true      # brightness, gamma, genlock, shuttersync, failover, cable loops
  override: true    # blackout, freeze, test pattern
  presets: true     # active preset number and name
  project: true     # project name (included in tessera_info)
  processing: true  # 3D LUT, curves, colour correct
  groups: true      # per-group overrides
  devices: true     # per-panel firmware/type

# Override collector settings for specific paths.
# 'include' takes priority over turning a collector off. 'exclude' takes priority over turning a collector on.
include: []
  # - "devices/statistics/*"   # e.g. Would enable panel counts even with devices: false

exclude: []
  # - "output/network/hidden-markers/**"  # e.g. Suppresses noisy hidden-marker fields


# Unit suffixes and scale factors. Path globs matched against the prefix-stripped value path. First match wins.
# name: suffix appended to the metric name
# scale: multiply the raw value by this factor before emitting (default 1.0)

# Units not in the API schema are derived from the 'TesseraIPControl' 3.5.2 PDF available from Brompton.
suffix:
  "system/temperature/*":
    name: "_celsius"

  "system/fan/*/speed":
    name: "_rpm"

  "output/network/shuttersync/dark-time":
    name: "_milliseconds"

  "output/network/shuttersync/sensor-readout-time":
    name: "_microseconds"

  "output/network/shuttersync/speed-settings/time":
    name: "_seconds"

  "output/network/failover/state/partner-absence-duration":
    name: "_seconds"

  "output/network/failover/state/partner-video-absence-duration":
    name: "_seconds"

  "override/blackout/fade-time":
    name: "_seconds"

  "output/network/genlock/internal-rate":
    name: "_hertz"

  "input/ports/*/meta-data/refresh-rate":
    name: "_hertz"

  "output/network/shuttersync/angle-settings/shutter-angle":
    name: "_degrees"

  "output/network/genlock/phase-offset/absolute/lines":
    name: "_lines"

  "output/network/genlock/phase-offset/absolute/pixels":
    name: "_pixels"

  # Percentage fields which return raw 0-100 (or 0-200) -> 0-1 ratio
  # 'proc-amp' fields are 0-200 (percent), e.g. contrast=150 means 150%
  "input/ports/*/proc-amp/*":
    name: "_ratio"
    scale: 0.01

  "output/dynacal/*/luminance-only-fraction":
    name: "_ratio"
    scale: 0.01

  "output/network/shuttersync/dark-time-percentage":
    name: "_ratio"
    scale: 0.01

  "output/network/hidden-markers/background-gain":
    name: "_ratio"
    scale: 0.01

  "output/network/hidden-markers/custom/marker-gain/*":
    name: "_ratio"
    scale: 0.01

  "output/network/hidden-markers/redspy/marker-gain":
    name: "_ratio"
    scale: 0.01

  "output/network/hidden-markers/startracker/*/marker-gain":
    name: "_ratio"
    scale: 0.01

  "output/network/startracker/background-gain":
    name: "_ratio"
    scale: 0.01

  "output/network/startracker/*/marker-gain":
    name: "_ratio"
    scale: 0.01

# Sentinel values: numeric values returned when a field is not applicable (e.g. no input signal).
# These produce NaN in the metric rather than a misleading number. Do not use a general "if value == -1: skip" rule because the firmware is inconsistent across units and across fields.
sentinels:
  "input/ports/*/meta-data/refresh-rate": [-1]
  "input/ports/*/meta-data/resolution/height": [-1, 0]
  "input/ports/*/meta-data/resolution/width": [-1, 0]
