name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml pytest

      - name: Run tests
        run: pytest tests/ -v --tb=short

  promtool:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Install promtool
        run: |
          PROM_VERSION="2.53.0"
          curl -sSL "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/prometheus-${PROM_VERSION}.linux-amd64.tar.gz" \
            | tar -xz --strip-components=1 prometheus-${PROM_VERSION}.linux-amd64/promtool
          chmod +x promtool
          sudo mv promtool /usr/local/bin/

      - name: Validate exporter self-metrics
        run: |
          python tessera_exporter.py --web.listen-address :19801 &
          EXPORTER_PID=$!
          sleep 2
          curl -sf http://localhost:19801/metrics | promtool check metrics
          kill $EXPORTER_PID

  publish:
    runs-on: ubuntu-latest
    needs: [test, promtool]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # tessera_exporter_build_info is the only metric on /metrics, and its
      # version label is a hand-maintained constant. v1.0.0 and v1.0.1 were
      # both published reporting version="0.1.0"; fail the release instead.
      - name: Check VERSION matches the release tag
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' tessera_exporter.py)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read VERSION from tessera_exporter.py"
            exit 1
          fi
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION=$VERSION in tessera_exporter.py"
            echo "Bump VERSION to $TAG (or retag) before publishing."
            exit 1
          fi
          echo "VERSION $VERSION matches tag $GITHUB_REF_NAME"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
