# tessera_exporter DOCKER COMPOSE // Version 1.1.1
# https://github.com/sethdotfm/tessera_exporter
name: tessera-exporter
services:
# ▼▼▼ ADD THESE LINES TO YOUR EXISTING DOCKER COMPOSE ▼▼▼
  tessera-exporter:
    container_name: 'tessera-exporter'
    image: ghcr.io/sethdotfm/tessera_exporter:latest
    ports:
      - "19800:19800"
    volumes:
      - ./tessera.yml:/app/tessera.yml:ro
    restart: unless-stopped

# ▼▼▼ ADD THESE OPTIONAL LINES TO ENABLE THE SYSLOG MONITOR ▼▼▼
#
#     ON macOS OR WINDOWS: comment out the 'tessera-exporter-syslog-alloy'
#     service below and run Alloy natively on the host instead. Docker Desktop
#     rewrites the source IP of UDP traffic arriving on a published port, so
#     every log line would look like it came from the same address and the
#     dashboard's per-processor filtering would not work. See the README.
#
  tessera-exporter-syslog-alloy:
    container_name: 'tessera-exporter-syslog-alloy'
    image: grafana/alloy:latest
    ports:
      - "514:1514/udp"
    volumes:
      - ./te-syslog-alloy/config.alloy:/etc/alloy/config.alloy:ro
      - te-syslog-alloy-data:/var/lib/alloy/data
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "--storage.path=/var/lib/alloy/data"
      - "/etc/alloy/config.alloy"
    restart: unless-stopped
    depends_on:
      - tessera-exporter-syslog-loki

  tessera-exporter-syslog-loki:
    container_name: 'tessera-exporter-syslog-loki'
    image: grafana/loki:latest
    ports:
      - "3101:3100"
    volumes:
      - ./te-syslog-loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - te-syslog-loki-data:/loki
    command:
      - "-config.file=/etc/loki/local-config.yaml"
    restart: unless-stopped

#   ▲▲▲ That's it! ▲▲▲

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./targets:/etc/prometheus/targets:ro # MOUNT TARGETS FILE
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    restart: unless-stopped
    depends_on:
      - tessera-exporter

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    restart: unless-stopped
    depends_on:
      - prometheus
      - tessera-exporter-syslog-loki

volumes:
  te-syslog-alloy-data:
  te-syslog-loki-data:
  grafana-data:
