# tessera_exporter DOCKER COMPOSE // Version 1.1.1
# https://github.com/sethdotfm/tessera_exporter
name: tessera-exporter
services:
# ▼▼▼ ADD THESE LINES TO YOUR EXISTING DOCKER COMPOSE ▼▼▼
  tessera-exporter:
    container_name: 'tessera-exporter'
    image: ghcr.io/sethdotfm/tessera_exporter:latest
    ports:
      - "19800:19800"
    volumes:
      - ./tessera_exporter_config.yml:/app/tessera.yml:ro
    restart: unless-stopped

# ▼▼▼ ADD THESE OPTIONAL LINES TO ENABLE THE SYSLOG MONITOR ▼▼▼
#
#     Loki (log storage) runs here in Docker. The receiver, Alloy, does NOT:
#     on macOS and Windows it has to run natively on the host. Docker Desktop
#     runs containers inside a VM that never sees the processors' real source
#     addresses, so every log line would arrive looking identical and the
#     dashboard's per-processor filtering would be useless. network_mode: host
#     does not help you there either.
#
#     Install Alloy natively with te-syslog-alloy/config.alloy -- see the README.
#
#     ON LINUX: uncomment the service below instead and skip the native install.
#     It is the same config file either way.
#
#  tessera-exporter-syslog-alloy:
#    container_name: 'tessera-exporter-syslog-alloy'
#    image: grafana/alloy:latest
#    # Shares the host's network stack, so Alloy sees each processor's real
#    # source address. Published ports are not available under host networking,
#    # which is why the config listens on :514 directly and why root is needed
#    # to bind it. The HTTP server below binds host :12345.
#    network_mode: host
#    user: root
#    volumes:
#      - ./te-syslog-alloy/config.alloy:/etc/alloy/config.alloy:ro
#      - te-syslog-alloy-data:/var/lib/alloy/data
#    command:
#      - "run"
#      - "--server.http.listen-addr=0.0.0.0:12345"
#      - "--storage.path=/var/lib/alloy/data"
#      - "/etc/alloy/config.alloy"
#    restart: unless-stopped
#    depends_on:
#      - tessera-exporter-syslog-loki

  tessera-exporter-syslog-loki:
    container_name: 'tessera-exporter-syslog-loki'
    image: grafana/loki:latest
    ports:
      - "3101:3100"
    volumes:
      - ./te-syslog-loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - te-syslog-loki-data:/loki
    command:
      - "-config.file=/etc/loki/local-config.yaml"
    restart: unless-stopped

#   ▲▲▲ That's it! ▲▲▲

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - prometheus-data:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./targets:/etc/prometheus/targets:ro # MOUNT TARGETS FILE
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    restart: unless-stopped
    depends_on:
      - tessera-exporter

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      # Required by the Tessera Overview and Detail dashboards.
      GF_INSTALL_PLUGINS: "marcusolsson-dynamictext-panel"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    restart: unless-stopped
    depends_on:
      - prometheus
      - tessera-exporter-syslog-loki

volumes:
  te-syslog-alloy-data:
  te-syslog-loki-data:
  prometheus-data:
  grafana-data:
