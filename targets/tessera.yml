# tessera_exporter targets/tessera.yml // Version 1.1.1
# https://github.com/sethdotfm/tessera_exporter

# Tessera processor targets for Prometheus file_sd.
# Edit this file to add/remove processors without touching prometheus.yml.
# Prometheus updates automatically, no reload needed.
#
# Format:
#   - targets: ["<ip>"]
#     labels:
#       site: "<site-id>"
#       location: "<human label>"

- targets: ["192.0.2.10"]
  labels:
    site: "STUDIO-1"
    location: "MAIN"
