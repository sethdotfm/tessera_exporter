# tessera_exporter te-syslog-loki/loki-config.yaml // Version 1.1.0
# https://github.com/sethdotfm/tessera_exporter
#
# Single-binary Loki, filesystem storage, 30d retention (matches this
# project's Prometheus retention default). Fine for a single site; if you're
# centralizing logs from many sites, point this at object storage instead.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

compactor:
  working_directory: /loki/compactor
  delete_request_store: filesystem
  retention_enabled: true
  retention_delete_delay: 2h

limits_config:
  retention_period: 720h # 30d default, for anything not matched below
  # Loki otherwise invents a `detected_level` label for any stream that lacks
  # `level`. The verbatim stream deliberately has no `level` (severity is kept
  # untranslated in syslog_severity), so Loki tagged every one of its lines
  # `unknown` and Grafana's log panel rendered a column of UNK badges.
  # The dashboard stream sets `level` explicitly and never needed discovery.
  discover_log_levels: false
  retention_stream:
    # Debug-level chatter is the vast majority of syslog volume and isn't
    # worth keeping long. Adjust the selector if you want a different split.
    - selector: '{job="tessera_syslog", level=~"debug|info"}'
      priority: 1
      period: 24h
    # The verbatim archive (te-syslog-alloy: loki.process "tessera_raw") keeps
    # everything the dashboard stream drops, so it is the larger of the two.
    # It exists to hand a complete log to the manufacturer after an incident,
    # which is a short-horizon need -- 7d by default. Raise it if you need a
    # longer window, and watch disk if you do.
    - selector: '{job="tessera_syslog_raw"}'
      priority: 10
      period: 168h

analytics:
  reporting_enabled: false
